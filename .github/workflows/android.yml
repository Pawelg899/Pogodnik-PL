name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - run: npm install
      - run: npm install --save-dev typescript
      - run: mkdir -p www/vendor && cp node_modules/leaflet/dist/leaflet.js www/vendor/leaflet.js && cp node_modules/leaflet/dist/leaflet.css www/vendor/leaflet.css && cp node_modules/leaflet/dist/images/* www/vendor/
      - run: npx cap add android
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - run: mkdir -p release && cp android/app/build/outputs/apk/debug/app-debug.apk release/Pogodnik-PL-v0.2.0-build006.apk
      - uses: actions/upload-artifact@v4
        with: {name: Pogodnik-PL-v0.2.0-build006, path: release/Pogodnik-PL-v0.2.0-build006.apk}