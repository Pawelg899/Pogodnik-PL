name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - run: npm install
      - run: npm install --save-dev typescript
      - run: node --check www/app.js
      - run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('www/index.html','utf8');
          const js=fs.readFileSync('www/app.js','utf8');
          const ids=new Set([...html.matchAll(/id=["']([^"']+)["']/g)].map(m=>m[1]));
          const refs=[...js.matchAll(/\$\(["']([^"']+)["']\)/g)].map(m=>m[1]);
          const missing=[...new Set(refs.filter(id=>!ids.has(id)))];
          if(missing.length){console.error('Missing HTML ids:',missing.join(', '));process.exit(1);}
          console.log('STATIC_ID_CHECK_OK');
          NODE
      - run: mkdir -p www/vendor && cp node_modules/leaflet/dist/leaflet.js www/vendor/leaflet.js && cp node_modules/leaflet/dist/leaflet.css www/vendor/leaflet.css && cp node_modules/leaflet/dist/images/* www/vendor/
      - run: npx cap add android
      - run: npx cap sync android
      - run: |
          mkdir -p android/app/src/main/java/pl/pogodnik/app
          mkdir -p android/app/src/main/res/layout android/app/src/main/res/drawable android/app/src/main/res/xml
          cp android-widget/PogodnikWeatherWidget.java android/app/src/main/java/pl/pogodnik/app/
          cp android-widget/PogodnikWidgetPlugin.java android/app/src/main/java/pl/pogodnik/app/
          cp android-widget/widget_weather.xml android/app/src/main/res/layout/widget_weather.xml
          cp android-widget/widget_bg.xml android/app/src/main/res/drawable/widget_bg.xml
          cp android-widget/widget_button.xml android/app/src/main/res/drawable/widget_button.xml
          cp android-widget/widget_info.xml android/app/src/main/res/xml/widget_info.xml
          cat > android/app/src/main/java/pl/pogodnik/app/MainActivity.java <<'JAVA'
          package pl.pogodnik.app;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(PogodnikWidgetPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          receiver='''<receiver android:name=".PogodnikWeatherWidget" android:exported="true">
              <intent-filter>
                  <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                  <action android:name="pl.pogodnik.app.WIDGET_REFRESH" />
              </intent-filter>
              <meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_info" />
          </receiver>'''
          marker='</application>'
          if 'PogodnikWeatherWidget' not in s:
              s=s.replace(marker, receiver+'\n    '+marker)
          p.write_text(s)
          PY
          grep -q 'PogodnikWeatherWidget' android/app/src/main/AndroidManifest.xml
          echo 'WIDGET_MANIFEST_OK'
      - run: sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET" /> <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" /> <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" /> <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" /> <application#' android/app/src/main/AndroidManifest.xml
      - run: |
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_NETWORK_STATE' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_FINE_LOCATION' android/app/src/main/AndroidManifest.xml
          echo 'MANIFEST_PERMISSIONS_OK'
      - run: cd android && ./gradlew assembleDebug
      - run: mkdir -p release && cp android/app/build/outputs/apk/debug/app-debug.apk release/Pogodnik-PL-build${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Pogodnik-PL-build${{ github.run_number }}
          path: release/Pogodnik-PL-build${{ github.run_number }}.apk
